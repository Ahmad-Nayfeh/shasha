# Shasha CI: unit tests -> signed release APK -> GitHub Release (read by the in-app updater).
#
# ─── Contract with app/build.gradle.kts ──────────────────────────────────────────────────────
# `./gradlew :app:assembleRelease` runs with these environment variables:
#   SHASHA_KEYSTORE_FILE      absolute path of the decoded keystore ($RUNNER_TEMP/shasha-release.jks).
#                             Unset or EMPTY = no signing secrets: the build must still succeed and
#                             produce an unsigned app-release-unsigned.apk (Dependabot PRs, forks).
#   SHASHA_KEYSTORE_PASSWORD  keystore password
#   SHASHA_KEY_ALIAS          key alias
#   SHASHA_KEY_PASSWORD       key password
#   SHASHA_VERSION_CODE       integer = 1000 + github.run_number, so it always increases. The APK's
#                             versionCode MUST equal it (checked below). Unset locally -> app default.
#                             If this file is ever renamed, run_number restarts at 1: raise the 1000.
#   SHASHA_UPDATE_TOKEN       optional fine-grained GitHub token (this repository only, Contents: read)
#                             for the in-app updater, because Releases of a private repo need auth.
#                             Empty when the secret is not set. It ends up inside the APK: never give
#                             it any write permission.
# versionName stays in app/build.gradle.kts; CI reads it back from the APK (aapt2 dump badging).
#
# ─── Repository secrets (Settings > Secrets and variables > Actions) ─────────────────────────
#   SIGNING_KEYSTORE_BASE64    the .jks as one base64 line:
#                                Linux:   base64 -w0 shasha-release.jks
#                                macOS:   base64 -i shasha-release.jks
#                                Windows: [Convert]::ToBase64String([IO.File]::ReadAllBytes("shasha-release.jks"))
#   SIGNING_KEYSTORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
#   UPDATE_TOKEN               optional, see SHASHA_UPDATE_TOKEN
# Builds of main (push, weekly schedule, manual run) FAIL without the four SIGNING_* secrets: an
# APK signed with another key cannot be installed over the previous one. Other branches and PRs
# build an unsigned APK and say so loudly.

name: Android

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'docs/**', 'scripts/**', 'branding/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'scripts/**', 'branding/**']
  schedule:
    - cron: '17 3 * * 5' # Friday 03:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded branch/PR runs are cancelled; main runs queue so a release is never cut in half.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  ANDROID_PLATFORM: platforms;android-37.0
  ANDROID_BUILD_TOOLS: 37.0.0
  APPLICATION_ID: com.ahmadnayfeh.shasha

jobs:
  test:
    name: Unit tests
    # Each commit is tested once: branch pushes via `push`; Dependabot branches and forks via
    # `pull_request` (a PR from a branch of this repo is already covered by its push run).
    if: >-
      (github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/dependabot/')) ||
      (github.event_name == 'pull_request' &&
        (startsWith(github.head_ref, 'dependabot/') ||
         github.event.pull_request.head.repo.full_name != github.repository)) ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          : "${ANDROID_HOME:?ANDROID_HOME is not set on this runner}"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          { yes || true; } | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS" > /dev/null
          test -x "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner"

      # `basic` = the open-source actions/cache provider, free for private repositories.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Run unit tests
        run: >-
          ./gradlew --stacktrace --continue
          :policy:test :youtube:testDebugUnitTest :remote:testDebugUnitTest :app:testDebugUnitTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            */build/reports/tests/
            */build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Release APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.apk.outputs.signed }}
      apk_name: ${{ steps.apk.outputs.apk_name }}
      version_name: ${{ steps.apk.outputs.version_name }}
      version_code: ${{ steps.prep.outputs.version_code }}
      extractor_version: ${{ steps.prep.outputs.extractor_version }}
      cert_sha256: ${{ steps.prep.outputs.cert_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          : "${ANDROID_HOME:?ANDROID_HOME is not set on this runner}"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          { yes || true; } | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "$ANDROID_PLATFORM" "build-tools;$ANDROID_BUILD_TOOLS" > /dev/null
          test -x "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Prepare version and signing key
        id: prep
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          MUST_SIGN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          echo "version_code=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          extractor=$(sed -nE 's/^newpipeExtractor[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' gradle/libs.versions.toml)
          echo "extractor_version=${extractor:-unknown}" >> "$GITHUB_OUTPUT"

          missing=()
          [ -n "$KEYSTORE_BASE64" ] || missing+=(SIGNING_KEYSTORE_BASE64)
          [ -n "$KEYSTORE_PASSWORD" ] || missing+=(SIGNING_KEYSTORE_PASSWORD)
          [ -n "$KEY_ALIAS" ] || missing+=(SIGNING_KEY_ALIAS)
          [ -n "$KEY_PASSWORD" ] || missing+=(SIGNING_KEY_PASSWORD)
          if [ "${#missing[@]}" -gt 0 ]; then
            if [ "$MUST_SIGN" = true ]; then
              echo "::error title=Signing secrets missing::main is released, so it must be signed. Add: ${missing[*]}"
              exit 1
            fi
            echo "::warning title=UNSIGNED BUILD::No signing secrets here (normal for Dependabot PRs): ${missing[*]}"
            echo "The APK will be unsigned: it proves the release build (R8) works but cannot be installed."
            echo "keystore_file=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          keystore="$RUNNER_TEMP/shasha-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          # Fail here with a clear message instead of deep inside Gradle.
          if ! keytool -list -keystore "$keystore" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null; then
            echo "::error title=Bad signing secrets::Check SIGNING_KEYSTORE_BASE64, SIGNING_KEYSTORE_PASSWORD, SIGNING_KEY_ALIAS."
            exit 1
          fi
          cert_sha256=$(keytool -exportcert -keystore "$keystore" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" |
            sha256sum | cut -d' ' -f1)
          echo "keystore_file=$keystore" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=$cert_sha256" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          SHASHA_KEYSTORE_FILE: ${{ steps.prep.outputs.keystore_file }}
          SHASHA_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SHASHA_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SHASHA_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SHASHA_VERSION_CODE: ${{ steps.prep.outputs.version_code }}
          SHASHA_UPDATE_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: ./gradlew --stacktrace :app:assembleRelease

      - name: Verify and name APK
        id: apk
        env:
          VERSION_CODE: ${{ steps.prep.outputs.version_code }}
          EXTRACTOR_VERSION: ${{ steps.prep.outputs.extractor_version }}
          EXPECTED_CERT: ${{ steps.prep.outputs.cert_sha256 }}
        run: |
          tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one release APK, found ${#apks[@]}: ${apks[*]}"
            exit 1
          fi
          apk="${apks[0]}"

          badging=$("$tools/aapt2" dump badging "$apk")
          package_line=$(grep -m1 '^package:' <<< "$badging")
          package=$(sed -nE "s/^package: name='([^']+)'.*/\1/p" <<< "$package_line")
          code=$(sed -nE "s/.* versionCode='([0-9]+)'.*/\1/p" <<< "$package_line")
          name=$(sed -nE "s/.* versionName='([^']+)'.*/\1/p" <<< "$package_line")
          echo "$package_line"
          if [ "$package" != "$APPLICATION_ID" ]; then
            echo "::error::APK package is '$package', expected '$APPLICATION_ID'"
            exit 1
          fi
          if [ "$code" != "$VERSION_CODE" ]; then
            echo "::error title=versionCode not applied::APK has '$code', expected $VERSION_CODE (read SHASHA_VERSION_CODE)."
            exit 1
          fi
          if ! [[ "$name" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "::error::versionName '$name' is empty or unusable in a tag/file name"
            exit 1
          fi

          if [ -n "$EXPECTED_CERT" ]; then
            if ! certs=$("$tools/apksigner" verify --print-certs "$apk"); then
              echo "::error title=Not signed::apksigner rejected $apk. Does the release signingConfig use SHASHA_KEYSTORE_FILE?"
              exit 1
            fi
            echo "$certs"
            # "V2 Signer: certificate SHA-256 digest: <hex>" (older apksigner: "Signer #1 certificate ...").
            actual=$(sed -nE 's/.*[Ss]igner.* certificate SHA-256 digest: ([0-9a-f]{64})$/\1/p' <<< "$certs" | sort -u)
            if [ "$actual" != "$EXPECTED_CERT" ]; then
              echo "::error title=Wrong signing key::APK signed by: ${actual//$'\n'/, }. Expected only $EXPECTED_CERT."
              exit 1
            fi
            signed=true
            apk_name="shasha-$name-$code.apk"
          else
            signed=false
            if "$tools/apksigner" verify "$apk" > /dev/null 2>&1; then
              apk_name="shasha-$name-$code-NOT-RELEASE-KEY.apk"
            else
              apk_name="shasha-$name-$code-unsigned.apk"
            fi
            echo "::warning title=Not release-signed::$apk_name cannot update the app on the TV."
          fi

          mkdir -p dist
          cp "$apk" "dist/$apk_name"
          {
            echo "signed=$signed"
            echo "apk_name=$apk_name"
            echo "version_name=$name"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### $apk_name"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| versionName / versionCode | \`$name\` / \`$code\` |"
            echo "| Release-signed | $signed |"
            echo "| Certificate SHA-256 | \`${EXPECTED_CERT:-none}\` |"
            echo "| NewPipeExtractor | \`$EXTRACTOR_VERSION\` |"
            echo "| Size | $(du -h "dist/$apk_name" | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Uploaded as the bare .apk (not zipped). Short retention: Releases keep the signed ones.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/${{ steps.apk.outputs.apk_name }}
          archive: false
          retention-days: 14
          if-no-files-found: error

      - name: Delete decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/shasha-release.jks"

  release:
    name: GitHub Release
    needs: build
    if: >-
      needs.build.outputs.signed == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.apk_name }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APK_NAME: ${{ needs.build.outputs.apk_name }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          EXTRACTOR_VERSION: ${{ needs.build.outputs.extractor_version }}
          CERT_SHA256: ${{ needs.build.outputs.cert_sha256 }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          tag="v$VERSION_NAME-$VERSION_CODE"
          apk=$(find dist -type f -name "$APK_NAME" -print -quit)
          if [ -z "$apk" ]; then
            echo "::error::$APK_NAME was not downloaded"
            ls -laR dist
            exit 1
          fi

          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::notice::Release $tag already exists (re-run); nothing to do."
            exit 0
          fi
          # The weekly run rebuilds main; publishing the same commit again would only make the
          # TV offer an "update" that changes nothing.
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            released=$(gh api --paginate "repos/$GH_REPO/tags" --jq '.[] | "\(.commit.sha) \(.name)"' |
              awk -v sha="$GITHUB_SHA" '$1 == sha && $2 ~ /^v/ { print $2 }')
            if [ -n "$released" ]; then
              echo "::notice::Commit $GITHUB_SHA is already released as ${released%%$'\n'*}; weekly build verified, no new release."
              exit 0
            fi
          fi

          subject=$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA" --jq '.commit.message | split("\n") | .[0]')
          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "## شاشة $VERSION_NAME ($VERSION_CODE)"
            echo
            echo "- **NewPipeExtractor:** \`$EXTRACTOR_VERSION\`"
            echo "- **Commit:** [\`${GITHUB_SHA:0:7}\`]($COMMIT_URL) $subject"
            echo "- **Build:** [$GITHUB_WORKFLOW #$GITHUB_RUN_NUMBER]($RUN_URL) ($GITHUB_EVENT_NAME)"
            echo "- **Signing certificate SHA-256:** \`$CERT_SHA256\`"
            echo
            echo "التثبيت: زر «فحص التحديثات» في التطبيق، أو من الحاسوب:"
            echo "\`scripts/adb-setup.sh <TV_IP> $APK_NAME\`"
          } > "$notes"

          gh release create "$tag" "$apk" \
            --target "$GITHUB_SHA" \
            --title "شاشة $VERSION_NAME ($VERSION_CODE)" \
            --notes-file "$notes" \
            --latest
          echo "::notice::Published $tag"
